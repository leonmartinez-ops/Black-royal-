<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Black Royal</title>
  <style>
    :root{
      --bg:#050505;--panel:#111214;--panel2:#18191c;--text:#f6f4ef;--muted:#98999e;
      --line:rgba(255,255,255,.1);--gold:#d8b46b;--green:#55d68b;--red:#ff6b76;
      --orange:#f4a94f;--blue:#79bfff;--safe:env(safe-area-inset-bottom);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
    body{background:radial-gradient(100% 44% at 50% 0,#1d1d1f 0,#050505 54%) fixed;-webkit-font-smoothing:antialiased}
    button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
    .app{width:min(100%,520px);margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + var(--safe))}
    .hidden{display:none!important}
    .splash{position:fixed;inset:0;z-index:100;background:#050505;display:grid;place-items:center;transition:opacity .7s ease,visibility .7s ease}
    .splash.done{opacity:0;visibility:hidden}
    .splash img{width:min(72vw,330px);animation:royalIntro 1.8s cubic-bezier(.2,.8,.2,1) both}
    @keyframes royalIntro{0%{opacity:0;transform:scale(.82);filter:blur(5px)}45%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:1;transform:scale(.58) translateY(-7vh)}}
    @media(prefers-reduced-motion:reduce){.splash img{animation:none}.splash{transition:none}}
    .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
    .top img{width:116px;height:68px;object-fit:contain;object-position:left center}
    .live-dot{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase}
    .live-dot i{width:7px;height:7px;border-radius:50%;background:#555}
    .live-dot.on{color:var(--green)}.live-dot.on i{background:var(--green);box-shadow:0 0 0 5px rgba(85,214,139,.09);animation:pulse 1.6s infinite}
    @keyframes pulse{50%{opacity:.45}}
    .eyebrow{font-size:.62rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
    h1{font-size:2.1rem;line-height:1.02;letter-spacing:-.055em;margin:8px 0 8px}
    .lead{color:var(--muted);font-size:.82rem;line-height:1.55;margin:0 0 24px}
    .section{margin:25px 0 10px;display:flex;align-items:center;justify-content:space-between}
    .section h2{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;margin:0;color:#c7c7ca}
    .section span{font-size:.65rem;color:var(--muted)}
    .match{width:100%;display:flex;gap:13px;align-items:center;text-align:left;padding:16px 15px;margin:0 0 10px;border:1px solid var(--line);border-radius:23px;background:linear-gradient(145deg,#1d1e21,#111214);box-shadow:0 15px 40px rgba(0,0,0,.25)}
    .match:active{transform:scale(.985)}
    .crests{width:45px;height:45px;position:relative;flex:none}
    .crests img{width:31px;height:31px;object-fit:contain;background:#f2f2f2;border-radius:50%;padding:3px;position:absolute}
    .crests img:first-child{left:0;top:0}.crests img:last-child{right:0;bottom:0}
    .match-main{min-width:0;flex:1}.teams{font-size:.93rem;font-weight:730;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta{font-size:.66rem;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status{font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;padding:7px 9px;border-radius:999px;border:1px solid var(--line);flex:none}
    .status.live{color:var(--green);border-color:rgba(85,214,139,.35);background:rgba(85,214,139,.08)}
    .status.finished{color:var(--blue);border-color:rgba(121,191,255,.32);background:rgba(121,191,255,.07)}
    .status.today{color:var(--gold);border-color:rgba(216,180,107,.35);background:rgba(216,180,107,.08)}
    .empty,.error{padding:24px;border:1px dashed var(--line);border-radius:22px;color:var(--muted);font-size:.78rem;line-height:1.55;text-align:center}
    .error{color:#ffadb4;border-color:rgba(255,107,118,.3)}
    .detail{position:fixed;inset:0;z-index:80;overflow-y:auto;background:radial-gradient(100% 40% at 50% 0,#202124 0,#050505 55%);transform:translateX(105%);visibility:hidden;transition:transform .36s cubic-bezier(.25,.8,.25,1),visibility .36s}
    .detail.on{transform:none;visibility:visible}
    .detail-inner{width:min(100%,520px);margin:auto;padding:calc(15px + env(safe-area-inset-top)) 16px calc(45px + var(--safe))}
    .back{min-height:44px;padding:0 13px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.05);font-size:.72rem}
    .hero{padding:25px 1px 18px}.hero .score{font-size:2.3rem;line-height:1;letter-spacing:-.055em;margin:8px 0}.hero .versus{font-size:1.75rem;line-height:1.08;letter-spacing:-.045em;margin:8px 0}.hero-meta{font-size:.72rem;color:var(--muted);line-height:1.6}
    .card{border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#1b1c1f,#101113);padding:18px;margin:0 0 13px}
    .card-title{font-size:.62rem;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
    .narrative{font-size:1.12rem;line-height:1.35;letter-spacing:-.025em;margin:0}.reason{font-size:.76rem;line-height:1.6;color:var(--muted);margin:10px 0 0}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
    .stat{border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035);border-radius:17px;padding:12px}.stat span{font-size:.57rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.stat b{font-size:1.2rem;display:block;margin-top:5px}
    .opportunity{padding:15px 0;border-bottom:1px solid rgba(255,255,255,.07)}.opportunity:last-child{border-bottom:0;padding-bottom:0}.opportunity:first-of-type{padding-top:3px}
    .opp-top{display:flex;align-items:flex-start;gap:10px}.opp-title{flex:1}.opp-title b{display:block;font-size:.93rem}.opp-title small{display:block;color:var(--muted);font-size:.65rem;margin-top:4px;line-height:1.4}
    .badge{font-size:.52rem;letter-spacing:.09em;padding:7px 8px;border-radius:999px;white-space:nowrap}.badge.good{color:var(--green);background:rgba(85,214,139,.09);border:1px solid rgba(85,214,139,.3)}.badge.caution{color:var(--orange);background:rgba(244,169,79,.08);border:1px solid rgba(244,169,79,.3)}.badge.fail{color:var(--red);background:rgba(255,107,118,.08);border:1px solid rgba(255,107,118,.3)}.badge.pending{color:var(--muted);border:1px solid var(--line)}
    .opp-copy{font-size:.72rem;line-height:1.55;color:#c4c4c7;margin-top:10px}.facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.fact{font-size:.56rem;color:var(--muted);padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.045)}
    .audit-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07)}.audit-row:last-child{border:0}.audit-row b{font-size:.8rem}.audit-row small{display:block;color:var(--muted);font-size:.63rem;margin-top:4px}
    .technical{margin-top:13px;width:100%;min-height:48px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.04);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
    .tech-body{font-size:.68rem;line-height:1.6;color:var(--muted);padding-top:12px}.disclaimer{text-align:center;color:#68696e;font-size:.61rem;line-height:1.55;margin:20px 14px}
    .loader{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.72rem}.loader i{width:16px;height:16px;border:2px solid #555;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="splash" id="splash"><img src="black-royal-logo.png" alt="Black Royal"></div>
  <main class="app">
    <header class="top">
      <img src="black-royal-logo.png" alt="Black Royal Sports Intelligence">
      <div class="live-dot" id="live-indicator"><i></i><span id="live-label">Actualizado</span></div>
    </header>
    <div class="eyebrow">Liga MX · Apertura 2026</div>
    <h1 id="round-title">Jornada 4</h1>
    <p class="lead">Elige un partido. Black Royal te explica qué se esperaba, qué está ocurriendo y qué pasó, sin promesas ni datos inventados.</p>
    <div id="matchday"><div class="loader"><i></i>Cargando los nueve partidos…</div></div>
  </main>

  <section class="detail" id="detail" aria-hidden="true">
    <div class="detail-inner">
      <button class="back" id="back">‹ Jornada</button>
      <div id="detail-content"></div>
    </div>
  </section>

  <script>
  (function(){
    'use strict';
    var API='/.netlify/functions/api-football';
    var LEAGUE=262, SEASON=2026, ROUND='Apertura - 4';
    var LIVE_STATUSES=['1H','HT','2H','ET','BT','P','SUSP','INT','LIVE'];
    var FINISHED_STATUSES=['FT','AET','PEN'];
    var state={fixtures:[],selected:null,liveTimer:null,lastUpdated:null};
    var marketNames={
      '1x2':'Resultado 1X2',dc:'Doble oportunidad',h1:'Primera mitad',h2:'Segunda mitad',
      btts:'Ambos equipos anotan',ou15:'Goles 1.5',ou25:'Goles 2.5',tot:'Total de goles',
      cor:'Córners',tar:'Tarjetas',rou:'Resultado + goles',dcg:'Doble oportunidad + goles'
    };
    var verifiedLegacy={
      '1550921':{
        summary:'Empate o Toluca era la lectura principal antes del partido.',
        reason:'API-Football estimaba 10% para Atlante, 45% para el empate y 45% para Toluca. La señal de córners quedó registrada por separado.',
        resultPick:{label:'Doble oportunidad',selection:'Empate o Toluca',outcome:'ACIERTO'},
        opportunities:[{id:'cor',selection:'OVER 9.5',market:54,ris:55,risk:1,evidence:89,sample:11}]
      },
      '1550922':{opportunities:[{id:'cor',selection:'UNDER 9.5',market:59,ris:50,risk:9,evidence:93,sample:12}]},
      '1550923':{opportunities:[{id:'cor',selection:'UNDER 9.5',market:59,ris:58,risk:1,evidence:93,sample:12}]}
    };

    function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];});}
    function getSaved(){try{return JSON.parse(localStorage.getItem('br_state_v1')||'{}');}catch(e){return {};}}
    function api(endpoint,params){
      var q=new URLSearchParams(Object.assign({endpoint:endpoint},params||{}));
      return fetch(API+'?'+q.toString(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('API '+r.status);return r.json();});
    }
    function mxDate(iso){return new Intl.DateTimeFormat('es-MX',{weekday:'short',day:'numeric',month:'short',timeZone:'America/Mexico_City'}).format(new Date(iso));}
    function mxTime(iso){return new Intl.DateTimeFormat('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Mexico_City'}).format(new Date(iso));}
    function localDay(iso){return new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'America/Mexico_City'}).format(new Date(iso));}
    function statusOf(item){return item.fixture&&item.fixture.status?item.fixture.status.short:'NS';}
    function isLive(item){return LIVE_STATUSES.indexOf(statusOf(item))>-1;}
    function isFinished(item){return FINISHED_STATUSES.indexOf(statusOf(item))>-1;}
    function bucket(item){
      if(isLive(item))return 'EN VIVO';
      if(isFinished(item))return 'FINALIZADOS';
      var d=localDay(item.fixture.date), today=localDay(new Date().toISOString());
      return d===today?'PARTIDOS DE HOY':'PRÓXIMOS';
    }
    function statusLabel(item){
      if(isLive(item))return (item.fixture.status.elapsed||'')+'\'';
      if(isFinished(item))return 'Finalizado';
      return localDay(item.fixture.date)===localDay(new Date().toISOString())?'Hoy':'Próximo';
    }
    function fixtureVenue(item){
      var v=item.fixture.venue||{};return [v.name,v.city].filter(Boolean).join(' · ')||'Ubicación por confirmar';
    }
    function renderMatch(item){
      var cls=isLive(item)?'live':isFinished(item)?'finished':localDay(item.fixture.date)===localDay(new Date().toISOString())?'today':'';
      var score=isFinished(item)||isLive(item)?' · '+(item.goals.home==null?0:item.goals.home)+'–'+(item.goals.away==null?0:item.goals.away):'';
      return '<button class="match" data-id="'+item.fixture.id+'">'+
        '<div class="crests"><img src="'+esc(item.teams.home.logo)+'" alt=""><img src="'+esc(item.teams.away.logo)+'" alt=""></div>'+
        '<div class="match-main"><div class="teams">'+esc(item.teams.home.name)+' vs '+esc(item.teams.away.name)+score+'</div>'+
        '<div class="meta">'+esc(mxDate(item.fixture.date))+' · '+esc(mxTime(item.fixture.date))+' · '+esc(fixtureVenue(item))+'</div></div>'+
        '<div class="status '+cls+'">'+esc(statusLabel(item))+'</div></button>';
    }
    function renderMatchday(){
      var order=['EN VIVO','PARTIDOS DE HOY','PRÓXIMOS','FINALIZADOS'], groups={};
      state.fixtures.forEach(function(f){var b=bucket(f);(groups[b]||(groups[b]=[])).push(f);});
      var html='';
      order.forEach(function(name){if(!groups[name]||!groups[name].length)return;html+='<div class="section"><h2>'+name+'</h2><span>'+groups[name].length+' partidos</span></div>'+groups[name].map(renderMatch).join('');});
      document.getElementById('matchday').innerHTML=html||'<div class="empty">No hay partidos disponibles para esta jornada.</div>';
      Array.prototype.forEach.call(document.querySelectorAll('.match'),function(btn){btn.onclick=function(){openFixture(Number(btn.dataset.id));};});
      var anyLive=state.fixtures.some(isLive),ind=document.getElementById('live-indicator');
      ind.classList.toggle('on',anyLive);document.getElementById('live-label').textContent=anyLive?'Datos en vivo':'Actualizado';
    }
    function savedSnapshot(id){
      var saved=getSaved(), snap=saved.analysisByFixture&&saved.analysisByFixture[String(id)];
      return snap||null;
    }
    function selection(s,id){
      if(id==='cor'&&s.cornerLine!=null)return (s.cornerSide==='over'?'OVER ':'UNDER ')+s.cornerLine;
      if(id==='ou15')return (s.ou15Side==='over'?'OVER ':'UNDER ')+'1.5';
      if(id==='ou25')return (s.ou25Side==='over'?'OVER ':'UNDER ')+'2.5';
      if(id==='btts')return s.bttsSide==='yes'?'SÍ':s.bttsSide==='no'?'NO':'—';
      if(id==='1x2')return s.selection1x2||'—';if(id==='dc')return s.dcSide||'—';return '—';
    }
    function opportunities(id){
      var legacy=verifiedLegacy[String(id)], snap=savedSnapshot(id), out=[];
      if(snap&&snap.m){Object.keys(snap.m).forEach(function(k){var a=snap.m[k],sample=k==='cor'?Number(snap.cornerSample)||0:Number(snap.risHistorico&&snap.risHistorico.muestra)||0;if(a&&a[0]!=null&&a[1]!=null&&a[2]!=null&&Number(a[3])>=35&&sample>=6)out.push({id:k,selection:selection(snap,k),market:a[0],ris:a[1],risk:a[2],evidence:a[3],sample:sample});});}
      if(!out.length&&legacy&&legacy.opportunities)out=legacy.opportunities.slice();
      return out.sort(function(a,b){return a.risk-b.risk||b.evidence-a.evidence||b.sample-a.sample;}).slice(0,10);
    }
    function confidence(o){return o.risk<=8&&o.evidence>=80?'Consistencia alta':o.risk<=25?'Cautela':'Evitar';}
    function opportunityCard(o){
      var good=o.risk<=8&&o.evidence>=80,cls=good?'good':'caution';
      var why='Se analizaron '+o.sample+' partidos con datos disponibles. Mercado y señal RIS '+(o.risk<=8?'estaban prácticamente alineados.':'mostraban una diferencia que exige cautela.');
      return '<div class="opportunity"><div class="opp-top"><div class="opp-title"><b>'+esc(marketNames[o.id]||o.id)+' · '+esc(o.selection)+'</b><small>'+esc(why)+'</small></div><span class="badge '+cls+'">'+confidence(o)+'</span></div>'+
        '<div class="facts"><span class="fact">Evidencia '+o.evidence+'%</span><span class="fact">Muestra '+o.sample+'</span><span class="fact">Riesgo relativo '+o.risk+'</span></div></div>';
    }
    function teamStats(detail,teamId){
      var rows=Array.isArray(detail.statistics)?detail.statistics:[],row=rows.find(function(r){return r.team&&r.team.id===teamId;});
      var map={};if(row&&Array.isArray(row.statistics))row.statistics.forEach(function(s){map[s.type]=s.value;});return map;
    }
    function num(v){if(v==null)return null;var n=Number(String(v).replace('%',''));return isNaN(n)?null:n;}
    function liveStats(detail){
      var h=teamStats(detail,detail.teams.home.id),a=teamStats(detail,detail.teams.away.id);
      function pair(label,key){var x=h[key],y=a[key];if(x==null&&y==null)return '';return '<div class="stat"><span>'+label+'</span><b>'+esc(x==null?'—':x)+' · '+esc(y==null?'—':y)+'</b></div>';}
      return pair('Posesión','Ball Possession')+pair('Tiros','Total Shots')+pair('A puerta','Shots on Goal')+pair('Córners','Corner Kicks')+pair('Tarjetas amarillas','Yellow Cards')+pair('Faltas','Fouls');
    }
    function audit(item,detail,opps){
      var rows=[],legacy=verifiedLegacy[String(item.fixture.id)];
      if(legacy&&legacy.resultPick)rows.push(legacy.resultPick);
      var h=teamStats(detail,item.teams.home.id),a=teamStats(detail,item.teams.away.id),corners=num(h['Corner Kicks'])!=null&&num(a['Corner Kicks'])!=null?num(h['Corner Kicks'])+num(a['Corner Kicks']):null;
      opps.forEach(function(o){var outcome='PENDIENTE';if(o.id==='cor'&&corners!=null){var over=/OVER/.test(o.selection),line=parseFloat(o.selection.replace(/[^0-9.]/g,''));outcome=(over?corners>line:corners<line)?'ACIERTO':'FALLO';}rows.push({label:marketNames[o.id]||o.id,selection:o.selection,outcome:outcome});});
      if(!rows.length)return '<div class="empty">No existe un snapshot prepartido verificable para comparar. Black Royal no reconstruye una predicción después del resultado.</div>';
      return rows.map(function(r){var cls=r.outcome==='ACIERTO'?'good':r.outcome==='FALLO'?'fail':'pending';return '<div class="audit-row"><div><b>'+esc(r.label)+'</b><small>'+esc(r.selection)+'</small></div><span class="badge '+cls+'">'+r.outcome+'</span></div>';}).join('');
    }
    function expectedNarrative(item,opps){
      var legacy=verifiedLegacy[String(item.fixture.id)];if(legacy&&legacy.summary)return {title:legacy.summary,reason:legacy.reason};
      if(opps.length){var first=opps[0];return {title:'La oportunidad mejor respaldada está en '+(marketNames[first.id]||first.id)+': '+first.selection+'.',reason:'La lectura utiliza datos de mercado, señal RIS, riesgo relativo y una muestra de '+first.sample+' partidos.'};}
      return {title:'Black Royal todavía no tiene evidencia suficiente para emitir una lectura.',reason:'El partido aparece en la jornada, pero el motor RIS aún no conserva un snapshot prepartido verificable. No llenaremos el espacio con una predicción inventada.'};
    }
    function renderDetail(item,detail){
      var live=isLive(item),finished=isFinished(item),opps=opportunities(item.fixture.id),n=expectedNarrative(item,opps),stats=liveStats(detail);
      var title=finished||live?'<div class="score">'+esc(item.teams.home.name)+' '+(item.goals.home==null?0:item.goals.home)+'–'+(item.goals.away==null?0:item.goals.away)+' '+esc(item.teams.away.name)+'</div>':'<div class="versus">'+esc(item.teams.home.name)+'<br>vs '+esc(item.teams.away.name)+'</div>';
      var html='<div class="hero"><div class="eyebrow">'+esc(statusLabel(item))+'</div>'+title+'<div class="hero-meta">'+esc(mxDate(item.fixture.date))+' · '+esc(mxTime(item.fixture.date))+'<br>'+esc(fixtureVenue(item))+'</div></div>';
      if(live){html+='<div class="card"><div class="card-title">Qué está ocurriendo</div><p class="narrative">Datos en vivo · '+esc(item.fixture.status.elapsed||0)+' minutos</p><div class="stats">'+(stats||'<div class="reason">Las estadísticas detalladas todavía no están disponibles.</div>')+'</div></div>';}
      html+='<div class="card"><div class="card-title">'+(finished?'Lo que Black Royal esperaba':'Qué espera Black Royal')+'</div><p class="narrative">'+esc(n.title)+'</p><p class="reason">'+esc(n.reason)+'</p></div>';
      html+='<div class="card"><div class="card-title">'+(opps.length?'Oportunidades detectadas':'Evidencia disponible')+'</div>'+(opps.length?opps.map(opportunityCard).join(''):'<div class="empty">SIN EVIDENCIA SUFICIENTE</div>')+'</div>';
      if(finished)html+='<div class="card"><div class="card-title">Pronóstico vs resultado</div>'+audit(item,detail,opps)+'</div>';
      html+='<div class="card"><button class="technical" id="tech-toggle">Ver análisis RIS</button><div class="tech-body hidden" id="tech-body">Mercado = probabilidad implícita disponible. Señal RIS = lectura histórica del modelo. Riesgo relativo = separación entre ambas lecturas. Evidencia y muestra se muestran únicamente cuando fueron guardadas antes del partido.</div></div>';
      html+='<p class="disclaimer">Black Royal es una herramienta analítica y educativa. No coloca apuestas, no garantiza resultados y no modifica retrospectivamente sus análisis.</p>';
      document.getElementById('detail-content').innerHTML=html;
      var toggle=document.getElementById('tech-toggle');if(toggle)toggle.onclick=function(){document.getElementById('tech-body').classList.toggle('hidden');};
    }
    function openFixture(id){
      var item=state.fixtures.find(function(f){return f.fixture.id===id;});if(!item)return;
      state.selected=id;var panel=document.getElementById('detail');panel.classList.add('on');panel.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
      document.getElementById('detail-content').innerHTML='<div class="hero"><div class="loader"><i></i>Preparando la lectura del partido…</div></div>';
      api('fixtures',{id:id}).then(function(data){var detail=data.response&&data.response[0]?data.response[0]:item;renderDetail(item,detail);}).catch(function(){renderDetail(item,item);});
    }
    function closeDetail(){var p=document.getElementById('detail');p.classList.remove('on');p.setAttribute('aria-hidden','true');document.body.style.overflow='';state.selected=null;}
    function mergeLive(live){
      var byId={};live.forEach(function(f){byId[f.fixture.id]=f;});state.fixtures=state.fixtures.map(function(f){return byId[f.fixture.id]||f;});renderMatchday();
      if(state.selected&&byId[state.selected])api('fixtures',{id:state.selected}).then(function(d){renderDetail(byId[state.selected],d.response&&d.response[0]||byId[state.selected]);});
    }
    function pollLive(){
      if(document.hidden)return;api('fixtures',{live:LEAGUE}).then(function(d){mergeLive(Array.isArray(d.response)?d.response:[]);state.lastUpdated=new Date();}).catch(function(){});
    }
    function loadRound(){
      api('fixtures',{league:LEAGUE,season:SEASON,round:ROUND}).then(function(data){
        state.fixtures=Array.isArray(data.response)?data.response.slice().sort(function(a,b){return new Date(a.fixture.date)-new Date(b.fixture.date);}):[];
        if(data.response&&data.response[0]&&data.response[0].league)document.getElementById('round-title').textContent=data.response[0].league.round||'Jornada';
        renderMatchday();pollLive();state.liveTimer=setInterval(pollLive,30000);
      }).catch(function(){document.getElementById('matchday').innerHTML='<div class="error">No pudimos cargar la jornada. Black Royal no mostrará partidos simulados. Intenta actualizar la página.</div>';});
    }
    document.getElementById('back').onclick=closeDetail;
    document.addEventListener('visibilitychange',function(){if(!document.hidden)pollLive();});
    window.addEventListener('load',function(){setTimeout(function(){document.getElementById('splash').classList.add('done');},1850);});
    loadRound();
  })();
  </script>
</body>
</html>
